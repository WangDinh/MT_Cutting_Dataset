[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mtcut"
version = "0.1.0"
description = "Tooling for the CNC milling cutting-sound (chatter) dataset (IMI lab + KRPM industry)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "openpyxl>=3.0",
]

[project.optional-dependencies]
notebook = ["jupyter", "ipykernel", "seaborn>=0.12"]
diffusion = ["torch>=2.0"]
chatter = ["scikit-learn>=1.2"]
dev = ["pytest>=7", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src"]
